<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}}; script-src 'nonce-{{nonce}}';">
<link rel="stylesheet" href="{{style}}"><title>Choose Colour</title>
</head><body><main class="colour-picker">
<p class="eyebrow">CODEX REPO COMPANION</p><h1>Choose Colour</h1><p id="target"></p>
<p>Choose a preset or make your own colour.</p>
<div id="presets" class="swatches" role="group" aria-label="Preset colours"></div>
<label for="picker">Custom colour</label><input id="picker" type="color" value="#6B8AFD" disabled>
<label for="hex">Hex colour</label><input id="hex" type="text" placeholder="#6B8AFD" maxlength="7" spellcheck="false" aria-describedby="colour-error" disabled>
<p id="colour-error" class="hint" role="status"></p><p id="choice" aria-live="polite"></p>
<button id="reset" class="secondary" disabled>Automatic</button>
<div class="actions"><button id="apply" disabled>Apply</button><button id="cancel" class="secondary">Cancel</button></div>
</main><script nonce="{{nonce}}" src="{{script}}"></script></body></html>
